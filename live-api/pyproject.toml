[project]
name = "synoptics-live"
version = "0.1.0"
description = "synoptics Live API server (synoptics-live/0.1-draft) with a mock engine and a real engine (demo backend upstream)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "pillow>=10",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synoptics_live"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
