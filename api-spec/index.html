<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>synoptics · API 명세와 클라이언트 통합 인계서</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown.min.css">
<style>
body{margin:0;background:#fff;color:#1f2328;font-family:system-ui,sans-serif}
.doc-nav{position:sticky;top:0;z-index:1;background:#fff;border-bottom:1px solid #d0d7de}
.doc-nav div{max-width:980px;margin:0 auto;box-sizing:border-box;padding:8px 16px;display:flex;flex-wrap:wrap;gap:4px 12px}
.doc-nav a{display:inline-flex;align-items:center;min-height:44px;color:#0969da;font-size:14px;text-underline-offset:4px}
a:focus-visible{outline:2px solid currentColor;outline-offset:4px;border-radius:2px}
.markdown-body{box-sizing:border-box;max-width:980px;margin:0 auto;padding:32px 16px;overflow-wrap:anywhere}
.markdown-body [id]{scroll-margin-top:128px}
.markdown-body pre,.markdown-body table{max-width:100%;overflow-x:auto}
@media(prefers-color-scheme:dark){body,.doc-nav{background:#0d1117;color:#e6edf3}.doc-nav{border-color:#30363d}.doc-nav a{color:#58a6ff}}
</style>
</head>
<body>
<nav class="doc-nav" aria-label="문서 바로가기"><div>
<a href="#api-reference">API 명세</a>
<a href="#client-handoff">통합 인계서</a>
<a href="#client-acceptance">인수 체크리스트</a>
<a href="live-api.md">전체 Markdown</a>
</div></nav>
<main id="doc" class="markdown-body" aria-busy="true">문서를 불러오는 중입니다…</main>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script>
fetch('live-api.md',{cache:'no-store'})
  .then(response=>{if(!response.ok)throw new Error('HTTP '+response.status);return response.text()})
  .then(text=>{
    const doc=document.getElementById('doc');
    doc.innerHTML=marked.parse(text);
    doc.setAttribute('aria-busy','false');
    const target=document.getElementById(location.hash.slice(1));
    if(target)target.scrollIntoView();
  })
  .catch(()=>{
    const doc=document.getElementById('doc');
    doc.textContent='문서를 불러오지 못했습니다. 위의 전체 Markdown 링크로 원문을 확인하거나 페이지를 다시 열어 주세요.';
    doc.setAttribute('aria-busy','false');
  });
</script>
</body>
</html>
