[project]
name = "visual-guidance-server"
version = "0.1.0"
description = "Backend for the generic agent-driven visualization tool: framed guidance contracts, strict provenance validation, and a single guidance endpoint"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pillow>=11,<13",
  "pypdf>=5,<8",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
